<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  layout:decorate="~{shop/fragments/base}"
>
  <section class="container features" th:fragment="content">
    <div class="wrapper wrapper-content animated fadeInRight">
      <div class="row">
        <div class="col-lg-12">
          <div class="navy-line"></div>
          <h1 class="text-center">ĐĂNG KÝ</h1>
          <div class="row">
            <form class="m-t" role="form" action="index.html">
              <div class="col-md-4">
                <div class="form-group">
                  <label for="name"
                    >Email <span style="color: red">(*)</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Email"
                    required=""
                  />
                </div>
                <div class="form-group">
                  <label for="name"
                    >Tên Đăng Nhập <span style="color: red">(*)</span></label
                  >
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Tên Đăng Nhập"
                    required=""
                  />
                </div>
                <div class="form-group">
                  <label for="password"
                    >Mật Khẩu <span style="color: red">(*)</span></label
                  >
                  <input
                    type="password"
                    class="form-control"
                    placeholder="Mật Khẩu"
                    required=""
                  />
                </div>
                <div class="form-group">
                  <label
                    >Số Điện Thoại <span style="color: red">(*)</span></label
                  >
                  <input
                    type="text"
                    id="sdt"
                    name="phone"
                    placeholder="Nhập Số Điện Thoại"
                    class="form-control"
                  />
                </div>
              </div>
              <div class="col-md-8">
                <div class="row">
                  <div class="col-md-6">
                    <div class="form-group">
                      <label>Họ Tên <span style="color: red">(*)</span></label>
                      <input
                        type="text"
                        id="hoTen"
                        name="fullName"
                        placeholder="Nhập Họ Tên"
                        class="form-control"
                      />
                      <span class="text-danger" id="error-hoTen"></span>
                    </div>
                    <div class="form-group" id="ngaySinhGroup">
                      <label
                        >Ngày Sinh <span style="color: red">(*)</span></label
                      >
                      <input
                        type="date"
                        id="dob"
                        name="dateOfBirth"
                        lang="vi"
                        class="form-control"
                      />
                      <span class="text-danger" id="error-dob"></span>
                    </div>
                    <div class="form-group">
                      <label style="margin-top: 7px">Giới Tính</label>
                      <div class="row" style="display: flex; margin-left: 2px">
                        <div class="i-checks">
                          <label>
                            <input
                              type="radio"
                              value="true"
                              id="genderNam"
                              name="gender"
                            />
                            Nam
                          </label>
                        </div>
                        <div class="i-checks m-l">
                          <label>
                            <input
                              type="radio"
                              value="false"
                              id="genderNu"
                              name="gender"
                            />
                            Nữ
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-group">
                      <label>Ảnh Đại Diện</label>
                      <div
                        id="avatarDropzone"
                        class="dropzone dz-clickable"
                      ></div>
                      <input
                        type="file"
                        id="avatarInput"
                        name="avatar"
                        style="display: none"
                      />
                      <span class="text-danger" id="error-avatar"></span>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-12">
                    <div class="form-group">
                      <label>Địa Chỉ <span style="color: red">(*)</span></label>
                      <input
                        type="text"
                        id="diaChi"
                        name="address"
                        placeholder="Nhập Địa Chỉ"
                        class="form-control"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <div class="col-md-5"></div>
                <div class="col-md-2">
                  <button
                    type="submit"
                    class="btn btn-primary block full-width m-b"
                    id="btnRegister"
                  >
                    Đăng Ký
                  </button>
                </div>
                <div class="col-md-5"></div>
              </div>
            </form>
          </div>
        </div>
        <hr />
      </div>
    </div>
  </section>
</html>
