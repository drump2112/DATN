<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="shop/fragments/base :: base">
<section class="container features" th:fragment="content">
  <div class="row">
    <div class="col-lg-12">
      <div class="navy-line"></div>
      <h1 class="text-center">
        Danh Sách Sản Phẩm
      </h1>
      <br />
      <div class="row">
        <div class="col-md-3" th:each="item : ${listProducts}">
          <div class="ibox">
            <div class="ibox-content product-box">
              <!-- <div class="product-imitation" style="overflow: hidden"> -->
              <!--   <img -->
              <!--     th:src="@{${item.thumbnail}}" -->
              <!--     alt="Thumbnail" -->
              <!--     style="width: 100%; height: 100%; object-fit: cover" -->
              <!--   /> -->
              <!-- </div> -->
              <div class="product-imitation"
                th:style="'background-image: url(' + @{${item.thumbnail}} + '); height: 200px; background-size: cover; background-position: center;'">
              </div>

              <div class="product-desc">
                <span class="product-price"> $10 </span>
                <small class="text-muted" th:text="${item.brandName}">Category</small>
                <a href="#" class="product-name" th:text="${item.name}">
                  Product</a>

                <div class="small m-t-xs">
                  Many desktop publishing packages and web page editors now.
                </div>
                <div class="m-t text-right">
                  <a th:href="@{'/details/' + ${item.id}}"
                    class="btn btn-xs btn-outline btn-primary no-landing-style">Chi Tiết<i
                      class="fa fa-long-arrow-right"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row"></div>
</section>

</html>
