<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  th:fragment="base">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="" />
  <meta name="author" content="" />

  <title>Trang Chủ</title>

  <!-- Bootstrap core CSS -->
  <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet" />

  <!-- Animation CSS -->
  <link th:href="@{/assets/css/animate.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/slick/slick.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/slick/slick-theme.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/awesome-bootstrap-checkbox/awesome-bootstrap-checkbox.css}" rel="stylesheet"
    class="__web-inspector-hide-shortcut__" />
  <link th:href="@{/assets/font-awesome/css/font-awesome.min.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/dropzone/dropzone.css}" rel="stylesheet" />

  <link rel="stylesheet" th:href="@{/assets/css/plugins/dropzone/basic.css}" />
  <!-- Select2 CSS -->
  <link th:href="@{/assets/css/plugins/select2/select2.min.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/style.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/iCheck/custom.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/toastr/toastr.min.css}" rel="stylesheet" />
  <!-- Chỉ sử dụng toastr, đã loại bỏ SweetAlert -->

  <style>
    .size input[type="radio"],
    .color input[type="radio"] {
      display: none;
    }

    .size label,
    .color label {
      display: inline-block;
      font-weight: 400;
      padding: 7px 14px;
      background-color: #f0f0f0;
      color: #333;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      margin: 5px;
    }

    .size input[type="radio"]:checked+label,
    .color input[type="radio"]:checked+label {
      background-color: #1bb394;
      color: white;
      border-color: #1bb394;
    }

    .dropdown-menu {
      z-index: 1050;
    }

    .logo-area {
      display: inline-block;
      width: 120px;
      height: 20px;
    }

    .logo-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ===== TOASTR CUSTOM STYLING ===== */
    .toast-top-right {
      top: 80px; /* Đặt dưới navbar */
      right: 20px;
    }

    .toast {
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .toast-success {
      background-color: #1ab394;
    }

    .toast-error {
      background-color: #ed5565;
    }

    .toast-warning {
      background-color: #f8ac59;
    }

    .toast-info {
      background-color: #23c6c8;
    }
  </style>
</head>

<body id="page-top" class="landing-page no-skin-config" style="position: relative;">
  <th:block th:replace="shop/fragments/header :: header"> </th:block>
  <th:block th:if="${showSlide}" th:replace="shop/fragments/slide :: slide"></th:block>
  <th:block th:replace="~{::content}"></th:block>
  <th:block th:replace="shop/fragments/footer :: footer"></th:block>
  <th:block th:replace="shop/fragments/chatbox :: chatbox"></th:block>
  <th:block th:replace="shop/fragments/script :: script"></th:block>
</body>

</html>
