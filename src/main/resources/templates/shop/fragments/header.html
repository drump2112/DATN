<th:block th:fragment="header">
  <div class="navbar-wrapper">
    <nav class="navbar navbar-default navbar-fixed-top" role="navigation">
      <div class="container">
        <div class="row">
          <div class="col-lg-7">
            <div class="navbar-header page-scroll">
              <button
                type="button"
                class="navbar-toggle collapsed"
                data-toggle="collapse"
                data-target="#navbar"
                aria-expanded="false"
                aria-controls="navbar"
              >
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
              </button>
              <a class="navbar-brand" th:href="@{/}">DTD-Snaker</a>
            </div>
            <div id="navbar" class="navbar-collapse collapse">
              <ul class="nav navbar-nav navbar-right">
                <li><a class="page-scroll" href="#page-top">Trang Chủ</a></li>
                <li><a class="page-scroll" href="#features">Adidas</a></li>
                <li><a class="page-scroll" href="#team">Nike</a></li>
                <li>
                  <a class="page-scroll" href="#testimonials">Puma</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="col-lg-2"></div>
          <div class="col-lg-3">
            <ul class="nav navbar-nav">
              <li id="cart-icon" style="position: relative">
                <a th:href="@{/cart}">
                  <i
                    class="fa fa-shopping-cart"
                    style="font-size: 20px; position: relative"
                  >
                    <span
                      class="badge badge-primary"
                      id="cart-count"
                      style="
                        position: absolute;
                        top: -10px;
                        right: -12px;
                        border-radius: 50%;
                        padding: 1px 5px;
                        font-size: 11px;
                        line-height: 1;
                      "
                    >
                      0
                    </span>
                  </i>
                </a>
              </li>
            </ul>

            <a
              th:href="@{/customer/auth/}"
              class="navbar-brand"
              style="margin-left: 20px"
              >Đăng nhập</a

          </div>
        </div>
      </div>
    </nav>
  </div>
