<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="shop/fragments/base :: base">

<section class="container" th:fragment="content">
  <style>
    .profile-wrapper {
      margin: 80px 0;
    }

    .profile-card {
      text-align: center;
    }

    .profile-avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #f3f3f4;
    }

    .profile-name {
      margin-top: 15px;
      font-size: 20px;
      font-weight: 600;
    }

    .profile-meta {
      color: #888;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .nav-tabs.profile-tabs>li>a {
      padding: 12px 16px;
      font-weight: 600;
    }

    .tab-pane {
      padding: 20px 5px;
    }

    .form-group.required label:after {
      content: "*";
      color: #ed5565;
      margin-left: 4px;
    }

    .kv {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 6px 0;
      color: #555;
    }

    .kv i {
      width: 16px;
      text-align: center;
      color: #1ab394;
    }

    .btn-outline {
      background: #fff;
      border: 1px solid #e7eaec;
    }

    @media (max-width: 767px) {
      .profile-avatar {
        width: 110px;
        height: 110px;
      }
    }
  </style>

  <div class="profile-wrapper row animated fadeIn">
    <div class="col-md-4">
      <div class="ibox">
        <div class="ibox-title">
          <h5>Hồ sơ</h5>
        </div>
        <div class="ibox-content profile-card"
          th:with="u=${#authentication != null && #authentication.isAuthenticated() ? #authentication.principal.user : null},
                                                     avatarUrl=${u != null && u.avatar != null} ? @{${u.avatar}} : @{/assets/img/profile_big.jpg}">
          <img class="profile-avatar" th:src="${avatarUrl}" alt="avatar">
          <div class="profile-name" th:text="${u != null ? u.fullName : 'Người dùng'}">Người dùng</div>
          <div class="profile-meta">
            <div class="kv" th:if="${u != null && u.email}"><i class="fa fa-envelope"></i><span
                th:text="${u.email}">email@example.com</span></div>
            <div class="kv" th:if="${u != null && u.phone}"><i class="fa fa-phone"></i><span
                th:text="${u.phone}">0123456789</span></div>
            <div class="kv" th:if="${u != null && u.address}"><i class="fa fa-map-marker"></i><span
                th:text="${u.address}">Địa chỉ</span></div>
          </div>
          <div class="m-t-sm">
            <label class="btn btn-white btn-sm">
              <i class="fa fa-upload"></i>
              <span>Đổi ảnh đại diện</span>
              <input id="avatarInput" type="file" accept="image/*" style="display:none">
            </label>
            <a th:href="@{/orders}" class="btn btn-outline btn-sm"><i class="fa fa-list"></i> Đơn hàng của tôi</a>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="ibox">
        <div class="ibox-title">
          <h5>Quản lý tài khoản</h5>
        </div>
        <div class="ibox-content">
          <ul class="nav nav-tabs profile-tabs" role="tablist">
            <li role="presentation" class="active"><a href="#tab-info" role="tab" data-toggle="tab">Thông tin</a></li>
            <li role="presentation"><a href="#tab-address" role="tab" data-toggle="tab">Địa chỉ</a></li>
            <li role="presentation"><a href="#tab-security" role="tab" data-toggle="tab">Bảo mật</a></li>
          </ul>

          <div class="tab-content">
            <div role="tabpanel" class="tab-pane active" id="tab-info"
              th:with="u=${#authentication != null && #authentication.isAuthenticated() ? #authentication.principal.user : null}">
              <form action="#" method="post" onsubmit="return false;">
                <div class="row">
                  <div class="col-sm-6">
                    <div class="form-group required">
                      <label>Họ và tên</label>
                      <input type="text" class="form-control" th:value="${u != null ? u.fullName : ''}"
                        placeholder="Nhập họ tên" />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group required">
                      <label>Email</label>
                      <input type="email" class="form-control" th:value="${u != null ? u.email : ''}"
                        placeholder="email@example.com" />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label>Số điện thoại</label>
                      <input type="text" class="form-control" th:value="${u != null ? u.phone : ''}"
                        placeholder="0123 456 789" />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label>Ngày sinh</label>
                      <input type="date" class="form-control"
                        th:value="${u != null && u.dateOfBirth != null ? u.dateOfBirth : ''}" />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label>Giới tính</label>
                      <select class="form-control" th:value="${u != null ? u.gender : ''}">
                        <option th:selected="${u != null && u.gender == true}">Nam</option>
                        <option th:selected="${u != null && u.gender == false}">Nữ</option>
                      </select>
                    </div>
                  </div>
                  <div class="col-sm-12">
                    <div class="form-group">
                      <label>Địa chỉ</label>
                      <textarea class="form-control" rows="2" th:text="${u != null ? u.address : ''}"
                        placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành" style="resize: none;"></textarea>
                    </div>
                  </div>
                </div>
                <div class="text-right">
                  <button type="button" class="btn btn-primary" disabled title="Chưa kết nối API">Lưu thay đổi</button>
                </div>
              </form>
            </div>

            <div role="tabpanel" class="tab-pane" id="tab-address">
              <p>Quản lý địa chỉ giao hàng của bạn. Tính năng đang được kết nối với dữ liệu hành chính (tỉnh/huyện/xã).
              </p>
              <div class="row">
                <div class="col-sm-6">
                  <div class="form-group required">
                    <label>Tỉnh/Thành</label>
                    <select id="province" class="form-control">
                      <option>— Chọn tỉnh/thành —</option>
                    </select>
                  </div>
                </div>

                <div class="col-sm-6">
                  <div class="form-group required">
                    <label>Phường/Xã</label>
                    <select id="ward" class="form-control">
                      <option>— Chọn phường/xã —</option>
                    </select>
                  </div>
                </div>
                <div class="col-sm-12">
                  <div class="form-group">
                    <label>Địa chỉ chi tiết</label>
                    <input class="form-control" placeholder="Số nhà, tên đường"/>
                  </div>
                </div>
              </div>
              <div class="text-right">
                <button type="button" class="btn btn-primary" disabled title="Chưa kết nối API">Lưu địa chỉ</button>
              </div>
            </div>

            <div role="tabpanel" class="tab-pane" id="tab-security">
              <form action="#" method="post" onsubmit="return false;">
                <div class="row">
                  <div class="col-sm-6">
                    <div class="form-group required">
                      <label>Mật khẩu hiện tại</label>
                      <input type="password" class="form-control" placeholder="••••••••" />
                    </div>
                  </div>
                  <div class="col-sm-6"></div>
                  <div class="col-sm-6">
                    <div class="form-group required">
                      <label>Mật khẩu mới</label>
                      <input type="password" class="form-control" placeholder="••••••••" />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group required">
                      <label>Nhập lại mật khẩu</label>
                      <input type="password" class="form-control" placeholder="••••••••" />
                    </div>
                  </div>
                </div>
                <div class="text-right">
                  <button type="button" class="btn btn-primary" disabled title="Chưa kết nối API">Đổi mật khẩu</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var tabs = document.querySelectorAll('.profile-tabs a[data-toggle="tab"]');
      var panes = document.querySelectorAll('.tab-pane');
      function showTab(targetId) {
        panes.forEach(function (p) { p.classList.remove('active'); });
        var el = document.querySelector(targetId);
        if (el) el.classList.add('active');
        tabs.forEach(function (a) { a.parentElement.classList.remove('active'); });
        var activeTab = Array.prototype.find.call(tabs, function (a) { return a.getAttribute('href') === targetId; });
        if (activeTab) activeTab.parentElement.classList.add('active');
      }
      tabs.forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          showTab(a.getAttribute('href'));
        });
      });

      var input = document.getElementById('avatarInput');
      if (input) {
        input.addEventListener('change', function (e) {
          var file = e.target.files && e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = document.querySelector('.profile-avatar');
            if (img) img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }
    })();
  </script>
</section>

</html>
