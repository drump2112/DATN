<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="base">

<head>
  <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet" />
  <link th:href="@{/assets/font-awesome/css/font-awesome.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/animate.css}" rel="stylesheet" />

  <link th:href="@{/assets/css/plugins/slick/slick.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/slick/slick-theme.css}" rel="stylesheet" />

  <link th:href="@{/assets/css/plugins/dataTables/datatables.min.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/select2/select2.min.css}" rel="stylesheet" />
  <link th:href="@{/main.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/iCheck/custom.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/dropzone/dropzone.css}" rel="stylesheet" />

  <link rel="stylesheet" th:href="@{/assets/css/plugins/dropzone/basic.css}" />
  <link th:href="@{/assets/css/plugins/toastr/toastr.min.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/plugins/steps/jquery.steps.css}" rel="stylesheet" />
  <link th:href="@{/assets/css/style.css}" rel="stylesheet" />
  <style>
    table td,
    table th {
      text-align: center;
      /* căn giữa theo chiều ngang */
      vertical-align: middle;
      /* căn giữa theo chiều dọc */
    }

    .wizard .content .body input {
      border: none;
    }

    .wizard .content .body ul li {
      list-style: none;
    }

    .select2-search__field {
      width: 100%;
    }

    .btn.bootstrap-touchspin-up,
    .btn.bootstrap-touchspin-down {
      border-color: #fff;
    }

    .voucher-item:hover {
      border-color: #007bff;
      transform: translateY(-3px);
      transition: all 0.2s ease-in-out;
      box-shadow: 1px 4px 10px rgba(0, 123, 255, 0.2);
    }

    .product-imitation {
      width: 100% !important;
      height: 150px !important;
      /* ép có chiều cao */
      background: #fff;
      border: 1px solid #eee;
      border-radius: 6px;
      display: flex !important;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0 !important;
    }

    .product-imitation img {
      display: block !important;
      width: auto !important;
      height: 100% !important;
      max-width: 100% !important;
      object-fit: contain !important;
    }
  </style>
  <title th:text="${pageTitle}">Default title</title>
</head>


<body>
  <div id="wrapper">
    <th:block th:replace="admin/layout/fragments/sidebar :: sidebar"></th:block>
    <div id="page-wrapper" class="gray-bg">
      <th:block th:replace="admin/layout/fragments/header :: header"></th:block>
      <div class="wrapper wrapper-content animated fadeInRight">
        <main>
          <div th:replace="~{::content}"></div>
        </main>
      </div>
      <th:block th:replace="admin/layout/fragments/footer :: footer"></th:block>
    </div>
  </div>
  <th:block th:replace="admin/layout/fragments/scripts :: scripts"></th:block>
  <th:block th:replace="~{::script}"></th:block>
</body>

</html>
