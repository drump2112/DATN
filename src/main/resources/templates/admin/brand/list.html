<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="admin/layout/base :: base"
>
  <th:block th:fragment="content">
    <div class="row col-lg-6" style="margin-left: 300px">
      <div class="ibox float-e-margins">
        <div class="ibox-title">
          <h5>Danh Sách Màu Sắc</h5>
          <div class="ibox-tools">
            <a class="collapse-link">
              <i class="fa fa-chevron-up"></i>
            </a>
            <a class="dropdown-toggle" data-toggle="dropdown" href="">
              <i class="fa fa-wrench"></i>
            </a>
            <a class="close-link">
              <i class="fa fa-times"></i>
            </a>
          </div>
        </div>
        <div class="ibox-content">
          <th:block th:replace="admin/brand/table :: table"></th:block>
        </div>
      </div>
    </div>
	<div class="modal inmodal" id="myModal" tabindex="-1" role="dialog" aria-hidden="true" style="padding-right: 15px;">
		<div class="modal-dialog">
			<div class="modal-content animated bounceInRight">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
							class="sr-only">Close</span></button>
					<h4 class="modal-title" id="modalTitle">Modal title</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<form role="form">
							<div class="col-sm-6 b-r">	
								<div class="form-group"><label>Mã Thương Hiệu</label> <input type="text" id="brandCode" placeholder="Brand Code" class="form-control" disabled></div>
								<div class="form-group"><label>Tên Thương Hiệu</label> <input type="text" id="nameBrand" placeholder="Tên Thương Hiệu" class="form-control"></div>
							</div>
							<div class="col-sm-6">
								<div class="form-group">
									<label for="">Logo</label>
									<div id="avatarDropzone" class="dropzone dz-clickable"></div>
									<input type="file" id="avatarInput" name="avatar" style="display:none;">
									<span class="text-danger" id="error-avatar"></span>
								</div>
							</div>
							<div>
								<button class="btn btn-sm btn-primary pull-right m-t-n-xs" id="btnAddBrand" type="button"><strong>Thêm</strong></button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
    <th:block th:fragment="script">
		<script th:src="@{/js/admin/brand.js}"></script>
    </th:block>
  </th:block>
</html>
