<th:block th:fragment="table">
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Ảnh</th>
        <th>Mã Sản Phẩm</th>
        <th>Tên Sản Phẩm</th>
        <th>Thương Hiệu</th>
        <th>Danh Mục</th>
        <th>Mô Tả</th>
        <th>Trạng Thái</th>
        <th>Hành Động</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each=" item : ${listProducts}">
        <td th:text="${item.id}"></td>
        <td>
          <img
            th:src="@{${item.thumbnail}}"
            alt="Thumbnail"
            style="
              width: 50px;
              height: 50px;
              object-fit: cover;
              border-radius: 50%;
            "
          />
        </td>
        <td th:text="${item.productCode}"></td>
        <td th:text="${item.name}"></td>
        <td th:text="${item.brandName}"></td>
        <td th:text="${item.categoryName}"></td>
        <td th:text="${item.description}"></td>
        <td th:switch="${item.isActive}">
          <span th:case="true" class="badge badge-primary"
            >Đang Kinh Doanh</span
          >
          <span th:case="false" class="badge badge-danger"
            >Ngừng Kinh Doanh</span
          >
        </td>
        <td>
          <button
            class="btn btn-info dim"
            type="button"
            th:attr="data-id=${item.id}"
            th:title="'Thông tin và cập nhật'"
            onclick="handleDetailClick(this)"
          >
            <i class="fa fa-paste"></i>
          </button>

          <button
            th:id="'btn-status-' + ${item.id}"
            th:class="'btn ' + (${item.isActive} ? 'btn-danger dim' : 'btn-primary dim')"
            th:onclick="|toggleStatus( ${item.id}, ${item.isActive} )|"
            th:title="${item.isActive} ? 'Khóa sản phẩm' : 'Mở khóa sản phẩm'"
          >
            <i th:class="${item.isActive} ? 'fa fa-lock' : 'fa fa-unlock'"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div
    class="dataTables_paginate paging_simple_numbers"
    id="DataTables_Table_0_paginate"
    th:if="${totalPages > 0}"
    style="text-align: right"
  >
    <ul
      class="pagination"
      id="paginationContainer"
      th:attr="data-total-pages=${totalPages}, data-current-page=${currentPage}"
    >
      <!-- Nút Previous -->
      <li
        class="paginate_button previous"
        th:classappend="${currentPage == 0} ? ' disabled'"
      >
        <a
          href="#"
          tabindex="0"
          th:onclick="'searchUser(' + (${currentPage - 1}) + ')'"
        >
          Previous
        </a>
      </li>

      <!-- Nút số trang 1..totalPages -->
      <li
        class="paginate_button"
        th:each="i : ${#numbers.sequence(1, totalPages)}"
        th:classappend="${i - 1 == currentPage} ? ' active'"
      >
        <a
          href="#"
          tabindex="0"
          th:text="${i}"
          th:onclick="'searchUser(' + (${i} - 1) + ')'"
        >
        </a>
      </li>

      <!-- Nút Next -->
      <li class="paginate_button next" th:if="${currentPage + 1 < totalPages}">
        <a
          href="#"
          tabindex="0"
          th:onclick="'searchUser(' + (${currentPage + 1}) + ')'"
        >
          Next
        </a>
      </li>

      <li
        class="paginate_button next disabled"
        th:unless="${currentPage + 1 < totalPages}"
      >
        <a
          href="#"
          tabindex="0"
          th:onclick="'searchUser(' + (${totalPages - 1}) + ')'"
        >
          Next
        </a>
      </li>
    </ul>
  </div>
</th:block>
