<th:block th:fragment="table">
  <table class="table table-striped" id="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Ảnh Đại Diện</th>
        <th>Mã Nhân viên</th>
        <th>Tên Đăng Nhập</th>
        <th>Email</th>
        <th>Họ Tên</th>
        <th>Địa Chỉ</th>
        <th>SĐT</th>
        <th>Giới Tính</th>
        <th>Ngày Sinh</th>
        <th>Vai Trò</th>
        <th>Ngày Tạo</th>
        <th>Trạng Thái</th>
        <th>Hành Động</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each=" item : ${listUsers}">
        <td th:text="${item.id}"></td>
        <td>
          <img
            th:src="@{${item.avatar}}"
            alt="Avatar"
            style="
              width: 50px;
              height: 50px;
              object-fit: cover;
              border-radius: 50%;
            "
          />
        </td>
        <td th:text="${item.userCode}"></td>
        <td th:text="${item.userName}"></td>
        <td th:text="${item.email}"></td>
        <td th:text="${item.fullName}"></td>
        <td th:text="${item.fullAddress}"></td>
        <td th:text="${item.phone}"></td>
        <td th:switch="${item.gender}">
          <span th:case="true">Nam</span>
          <span th:case="false">Nữ</span>
        </td>
        <td th:text="${#temporals.format(item.dateOfBirth, 'dd/MM/yyyy')}"></td>
        <td th:text="${item.roleName}"></td>
        <td th:text="${#dates.format(item.createAt, 'dd/MM/yyyy')}"></td>
        <td th:switch="${item.isActive}">
          <span th:case="true" class="badge badge-primary">Hoạt Động</span>
          <span th:case="false" class="badge badge-danger">Ngừng</span>
        </td>
        <td>
          <button
            class="btn btn-info dim"
            type="button"
            th:attr="data-id=${item.id},
                  data-usercode=${item.userCode},
                  data-fullname=${item.fullName},
                  data-email=${item.email},
                  data-username=${item.userName},
                  data-phone=${item.phone},
                  data-address=${item.address},
                  data-role=${item.roleId},
				  data-avatar=${item.avatar},
				  data-gender=${item.gender},
			      data-dob=${item.dateOfBirth}
						"
            th:title="'Thông tin và cập nhật'"
            onclick="handleDetailClick(this)"
          >
            <i class="fa fa-eye"></i>
          </button>

          <button
            th:id="'btn-status-' + ${item.id}"
            th:class="'btn ' + (${item.isActive} ? 'btn-danger dim' : 'btn-primary dim')"
            th:onclick="|toggleStatus( ${item.id}, ${item.isActive} )|"
            th:title="${item.isActive} ? 'Khóa tài khoản' : 'Kích hoạt tài khoản'"
          >
            <i th:class="${item.isActive} ? 'fa fa-lock' : 'fa fa-unlock'"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div class="text-center" th:if="${totalPages > 1}">
    <ul class="pagination">
      <li th:class="${currentPage == 0} ? 'disabled' : ''">
        <a th:if="${currentPage > 0}" href="#" th:onclick="'searchUser(' + (${currentPage - 1}) + ')'">
          <i class="fa fa-angle-left"></i> Trước
        </a>
        <span th:if="${currentPage == 0}" class="disabled">
          <i class="fa fa-angle-left"></i> Trước
        </span>
      </li>

      <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
          th:class="${i == currentPage} ? 'active' : ''">
        <a href="#" th:onclick="'searchUser(' + (${i}) + ')'" th:text="${i + 1}">1</a>
      </li>

      <li th:class="${currentPage == totalPages - 1} ? 'disabled' : ''">
        <a th:if="${currentPage < totalPages - 1}" href="#" th:onclick="'searchUser(' + (${currentPage + 1}) + ')'">
          Sau <i class="fa fa-angle-right"></i>
        </a>
        <span th:if="${currentPage == totalPages - 1}" class="disabled">
          Sau <i class="fa fa-angle-right"></i>
        </span>
      </li>
    </ul>
    <p class="text-muted">
      Hiển thị trang <strong th:text="${currentPage + 1}">1</strong>
      / <strong th:text="${totalPages}">1</strong>
      (Tổng <strong th:text="${totalItems}">0</strong> nhân viên)
    </p>
  </div>
</th:block>
