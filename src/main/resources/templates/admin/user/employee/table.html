<th:block th:fragment="table">
  <table class="table table-striped" id="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Ảnh Đại Diện</th>
        <th>Mã Nhân viên</th>
        <th>Tên Đăng Nhập</th>
        <th>Email</th>
        <th>Họ Tên</th>
        <th>Địa Chỉ</th>
        <th>SĐT</th>
        <th>Giới Tính</th>
        <th>Ngày Sinh</th>
        <th>Vai Trò</th>
        <th>Trạng Thái</th>
        <th>Hành Động</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each=" item : ${listUsers}">
        <td th:text="${item.id}"></td>
        <td>
          <img
            th:src="@{${item.avatar}}"
            alt="Avatar"
            style="
              width: 50px;
              height: 50px;
              object-fit: cover;
              border-radius: 50%;
            "
          />
        </td>
        <td th:text="${item.userCode}"></td>
        <td th:text="${item.userName}"></td>
        <td th:text="${item.email}"></td>
        <td th:text="${item.fullName}"></td>
        <td th:text="${item.address}"></td>
        <td th:text="${item.phone}"></td>
        <td th:switch="${item.gender}">
          <span th:case="true">Nam</span>
          <span th:case="false">Nữ</span>
        </td>
        <td th:text="${item.dateOfBirth}"></td>
        <td th:text="${item.roleName}"></td>
        <td th:switch="${item.isActive}">
          <span th:case="true" class="badge badge-primary">Hoạt Động</span>
          <span th:case="false" class="badge badge-danger">Ngừng</span>
        </td>
        <td>
          <button
            class="btn btn-info dim"
            type="button"
            th:attr="data-id=${item.id}, 
                  data-usercode=${item.userCode}, 
                  data-fullname=${item.fullName}, 
                  data-email=${item.email}, 
                  data-username=${item.userName}, 
                  data-phone=${item.phone}, 
                  data-address=${item.address}, 
                  data-role=${item.roleId},
				  data-avatar=${item.avatar}
						"
            onclick="handleDetailClick(this)"
          >
            <i class="fa fa-paste"></i>
          </button>

          <button
            th:id="'btn-status-' + ${item.id}"
            th:class="'btn ' + (${item.isActive} ? 'btn-danger dim' : 'btn-primary dim')"
            th:onclick="|toggleStatus( ${item.id}, ${item.isActive} )|"
            th:title="${item.isActive} ? 'Khóa tài khoản' : 'Kích hoạt tài khoản'"
          >
            <i th:class="${item.isActive} ? 'fa fa-lock' : 'fa fa-unlock'"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <div
    class="dataTables_paginate paging_simple_numbers"
    id="DataTables_Table_0_paginate"
    th:if="${totalPages > 0}"
    style="text-align: right"
  >
    <ul
      class="pagination"
      id="paginationContainer"
      th:attr="data-total-pages=${totalPages}, data-current-page=${currentPage}"
    >
      <!-- Nút Previous -->
      <li
        class="paginate_button previous"
        th:classappend="${currentPage == 0} ? ' disabled'"
      >
        <a
          href="#"
          tabindex="0"
          th:onclick="'searchUser(' + (${currentPage - 1}) + ')'"
        >
          Previous
        </a>
      </li>

      <!-- Nút số trang 1..totalPages -->
      <li
        class="paginate_button"
        th:each="i : ${#numbers.sequence(1, totalPages)}"
        th:classappend="${i - 1 == currentPage} ? ' active'"
      >
        <a
          href="#"
          tabindex="0"
          th:text="${i}"
          th:onclick="'searchUser(' + (${i} - 1) + ')'"
        >
        </a>
      </li>

      <!-- Nút Next -->
      <li class="paginate_button next" th:if="${currentPage + 1 < totalPages}">
        <a
          href="#"
          tabindex="0"
          th:onclick="'searchUser(' + (${currentPage + 1}) + ')'"
        >
          Next
        </a>
      </li>

      <li
        class="paginate_button next disabled"
        th:unless="${currentPage + 1 < totalPages}"
      >
        <a
          href="#"
          tabindex="0"
          th:onclick="'searchUser(' + (${totalPages - 1}) + ')'"
        >
          Next
        </a>
      </li>
    </ul>
  </div>
</th:block>
