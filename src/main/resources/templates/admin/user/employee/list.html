<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="admin/layout/base :: base">
<th:block th:fragment="content">
	<div class="row">
		<div class="ibox float-e-margins">
			<div class="ibox-title">
				<h5>Quản Lý Người Dùng</h5>
				<div class="ibox-tools">
					<a class="collapse-link">
						<i class="fa fa-chevron-up"></i>
					</a>
					<a class="dropdown-toggle" data-toggle="dropdown" href="#">
						<i class="fa fa-wrench"></i>
					</a>
					<a class="close-link">
						<i class="fa fa-times"></i>
					</a>
				</div>
			</div>
			<div class="ibox-content">
				<div class="row">
					<div class="col-sm-2 m-b-xs">
						<select class="input-sm form-control input-s-sm inline">
							<option value="1">Hoạt Động</option>
							<option value="0">Ngừng Hoạt Động</option>
						</select>
					</div>
					<div class="col-sm-3">
						<div class="input-group">
							<input type="text" placeholder="Tìm Kiếm(Ma Nv,Sdt)" class="input-sm form-control" id="searchInput">
							<span class="input-group-btn">
								<button type="button" class="btn btn-sm btn-primary" onclick="searchUser(0)">
									<i class="fa fa-search"></i>
								</button>
							</span>
						</div>
					</div>
					<div class="col-sm-7 m-b-xs">
						<button type="button" class="btn btn-w-m btn-primary pull-right" onclick="openAddModal()">Thêm
							Nhân Viên</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="ibox float-e-margins">
			<div class="ibox-title">
				<h5>Danh Sách Nhân viên</h5>
				<div class="ibox-tools">
					<a class="collapse-link">
						<i class="fa fa-chevron-up"></i>
					</a>
					<a class="dropdown-toggle" data-toggle="dropdown" href="">
						<i class="fa fa-wrench"></i>
					</a>
					<a class="close-link">
						<i class="fa fa-times"></i>
					</a>
				</div>
			</div>
			<div class="ibox-content" id="employeeTableContainer">
				<th:block th:replace="admin/user/employee/table :: table"></th:block>
			</div>
		</div>
	</div>
	<div class="modal inmodal" id="myModal" tabindex="-1" role="dialog" aria-hidden="true" style="padding-right: 15px;">
		<div class="modal-dialog" style="width: 1200px;	">
			<div class="modal-content animated bounceInRight">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
							class="sr-only">Close</span></button>
					<h4 class="modal-title" id="modalTitle">Modal title</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<form id="employeeForm" role="form">
							<div class="col-sm-6 b-r">
								<div class="form-group">
									<label>Mã NV</label>
										<input type="text" id="maNv" name="maNv" placeholder="{-Mã Nhân Viên được tạo tự động có dạng : NV-XXX -}"
										class="form-control" readonly>
								</div>
								<div class="form-group">
									<label>Họ Tên</label>
									<input type="text" id="hoTen" name="hoTen" placeholder="Nhập Họ Tên"
										class="form-control"> 
											<span class="text-danger" id="error-hoTen"></span>
								</div>
								<div class="form-group">
									<label>Email</label>
									<input type="text" id="email" name="email" placeholder="Nhập Email"
										class="form-control"> 
									 <span class="text-danger" id="error-email"></span>
								</div>
								<div class="form-group">
									<label>Số Điện Thoại</label>
									<input type="text" id="sdt" name="sdt" placeholder="Nhập Số Điện Thoại"
										class="form-control">
									<span class="text-danger" id="error-sdt"></span>
								</div>
								<div class="form-group">
									<label>Ngày Sinh</label>
									<input type="date" id="dob" name="dob" class="form-control">
									<span class="text-danger" id="error-dob"></span>
								</div>
							</div>
							<div class="col-sm-6">
								<div class="form-group">
									<label>Tên Đăng Nhập</label>
									<input type="text" id="tenDangNhap" name="tenDangNhap"
										placeholder="Nhập Tên Đăng Nhập" class="form-control">
											<span class="text-danger" id="error-tenDangNhap"></span>
								</div>
								<div class="form-group">
									<label>Mật Khẩu</label>
									<input type="password" id="matKhau" name="matKhau" placeholder="Nhập Mất Khẩu"
										class="form-control">
									<span class="text-danger" id="error-matKhau"></span>
								</div>

								<div class="form-group">
									<label>Vai Trò</label>
									<select class="form-control m-b" id="vaiTro" name="vaiTro">
										<option value="1">Quản Trị Viên</option>
										<option value="2">Nhân Viên Bán Hàng</option>
									</select>
									<span class="text-danger" id="error-vaiTro"></span>
								</div>
								<div class="form-group">
									<label>Địa Chỉ</label>
									<input type="text" id="diaChi" name="diaChi" placeholder="Nhập Địa Chỉ" class="form-control">
									<span class="text-danger" id="error-diaChi"></span>
								</div>
								<div class="form-group">
									<label>Giới Tính</label>
									<div class="row" style="display: flex;margin-left: 2px">
										<div class="i-checks"><label class=""> <div class="iradio_square-green" style="position: relative;">
											<input type="radio" value="0" name="gender" style="position: absolute; opacity: 0;">
											<ins class="iCheck-helper" style="position: absolute; top: 0%; left: 0%; display: block; width: 100%; height: 100%; margin: 0px; padding: 0px; background: rgb(255, 255, 255); border: 0px; opacity: 0;">
											</ins>
										</div> <i></i>Nam</label></div>
										<div class="i-checks m-l">
											<label class="">
											<div class="iradio_square-green" style="position: relative;">
												<input type="radio" value="1" name="gender" style="position: absolute; opacity: 0;">
												<ins class="iCheck-helper" style="position: absolute; top: 0%; left: 0%; display: block; width: 100%; height: 100%; margin: 0px; padding: 0px; background: rgb(255, 255, 255); border: 0px; opacity: 0;">
												</ins>
											</div><i></i>Nữ</label>
										</div>
									</div>
								</div>
							</div>
							<div style="margin-right: 14px">
								<button id="btnUpdate" class="btn btn-sm btn-success pull-right m-t-n-xs" type="button">
									<strong>Cập Nhật</strong>
								</button>
								<button id="btnAdd" class="btn btn-sm btn-primary pull-right m-t-n-xs" type="button"
									style="margin-right:6px;">
									<strong>Thêm</strong>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
		<script th:src="@{/js/employee.js}"></script>
</th:block>
</html>
