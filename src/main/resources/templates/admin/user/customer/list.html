<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="admin/layout/base :: base">
<th:block th:fragment="content">
	<div class="row">
		<div class="ibox float-e-margins">
			<div class="ibox-title">
				<h5>Chức Năng</h5>
				<div class="ibox-tools">
					<a class="collapse-link">
						<i class="fa fa-chevron-up"></i>
					</a>
				</div>
			</div>
			<div class="ibox-content">
				<div class="row">
					<div class="col-sm-2 m-b-xs">
						<select class="input-sm form-control input-s-sm inline">
							<option value="1">Hoạt Động</option>
							<option value="0">Ngừng Hoạt Động</option>
						</select>
					</div>
					<div class="col-sm-3">
						<div class="input-group">
							<input type="text" placeholder="Tìm Kiếm" class="input-sm form-control">
							<span class="input-group-btn">
								<button type="button" class="btn btn-sm btn-primary">
									<i class="fa fa-search"></i>
								</button>
							</span>
						</div>
					</div>
					<div class="col-sm-7 m-b-xs">
						<button type="button" class="btn btn-w-m btn-info __web-inspector-hide-shortcut__  pull-right">
							Lịch Sử Mua Hàng
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="ibox float-e-margins">
			<div class="ibox-title">
				<h5>Danh Sách Khách Hàng</h5>
				<div class="ibox-tools">
					<a class="collapse-link">
						<i class="fa fa-chevron-up"></i>
					</a>
				</div>
			</div>
			<div class="ibox-content">
				<th:block th:replace="admin/user/customer/table :: table"></th:block>
			</div>
			<th:block th:fragment="script">
				<script th:src="@{/js/admin/customer.js}"></script>
			</th:block>
		</div>
	</div>


	<div class="modal inmodal" id="myModal" tabindex="-1" role="dialog" aria-hidden="true" style="padding-right: 15px;"
		data-backdrop="static" data-keyboard="false">
		<div class="modal-dialog" style="width: 1200px; ">
			<div class="modal-content animated bounceInRight">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
							class="sr-only">Close</span></button>
					<h4 class="modal-title" id="modalTitle">Modal title</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<form id="customerForm" role="form">
							<div class="col-sm-4 b-r">
								<input type="hidden" id="userId" name="userId">
								<div class="form-group">
									<label>Mã Khách Hàng</label>
									<input type="text" id="maNv" name="maNv"
										placeholder="{-Mã Nhân Viên được tạo tự động có dạng : NV-XXX -}" class="form-control" readonly>
								</div>
								<div class="form-group">
									<label>Họ Tên</label>
									<input type="text" id="hoTen" name="fullName" placeholder="Nhập Họ Tên" class="form-control">
									<span class="text-danger" id="error-hoTen"></span>
								</div>
								<div class="form-group">
									<label>Email</label>
									<input type="text" id="emailrs" name="email" placeholder="Nhập Email" class="form-control">
									<span class="text-danger" id="error-email"></span>
								</div>
								<div class="form-group">
									<label>Số Điện Thoại</label>
									<input type="text" id="sdtrs" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control">
									<span class="text-danger" id="error-sdt"></span>
								</div>
								<div class="form-group">
									<label>Vai Trò</label>
									<select class="form-control m-b" id="vaiTro" name="roleId" readonly>
										<option value="1">Quản Trị Viên</option>
										<option value="2">Nhân Viên Bán Hàng</option>
										<option value="3">Khách Hàng</option>
									</select>
									<span class="text-danger" id="error-vaiTro"></span>
								</div>

							</div>
							<div class="col-sm-4 b-r">
								<div class="form-group">
									<label>Địa Chỉ Cụ Thể</label>
									<input type="text" id="diaChiCuThe" name="specificAddress" placeholder="Nhập số nhà, tên đường"
										class="form-control">
									<span class="text-danger" id="error-diaChiCuThe"></span>
								</div>
								<div class="form-group">
									<label>Tỉnh/Thành phố</label>
									<select class="form-control" id="tinhThanh" name="provinceCode">
										<option value="">-- Chọn Tỉnh/Thành phố --</option>
									</select>
									<span class="text-danger" id="error-tinhThanh"></span>
								</div>
								<div class="form-group">
									<label>Phường/Xã</label>
									<select class="form-control" id="phuongXa" name="communeCode" disabled>
										<option value="">-- Chọn Phường/Xã --</option>
									</select>
									<span class="text-danger" id="error-phuongXa"></span>
								</div>
								<div class="form-group">
									<label style="margin-top: 7px;">Giới Tính</label>
									<div class="row" style="display: flex; margin-left: 2px">
										<div class="i-checks">
											<label>
												<input type="radio" value="true" id="genderNam" name="gender"> Nam
											</label>
										</div>
										<div class="i-checks m-l">
											<label>
												<input type="radio" value="false" id="genderNu" name="gender"> Nữ
											</label>
										</div>
									</div>
									<span class="text-danger" id="error-gioiTinh"></span>
								</div>
								<div class="form-group">
									<label>Ngày Sinh</label>
									<input type="date" id="dob" name="dateOfBirth" lang="vi" class="form-control">
									<span class="text-danger" id="error-dob"></span>
								</div>
							</div>
							<div class="col-sm-4">
								<div class="form-group">
									<label>Ảnh Đại Diện</label>
									<div id="avatarDropzone" class="dropzone dz-clickable"></div>
									<input type="file" id="avatarInput" name="avatar" style="display:none;">
									<span class="text-danger" id="error-avatar"></span>
								</div>
							</div>
							<br>
							<div style="margin-right: 14px">
								<button id="btnUpdate" class="btn btn-sm btn-success pull-right m-t-n-xs" type="button">
									<strong>Cập Nhật</strong>
								</button>
								<button id="btnAdd" class="btn btn-sm btn-primary pull-right m-t-n-xs" type="button"
									style="margin-right:6px;">
									<strong>Thêm</strong>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="modal inmodal" id="updateMatKhau" tabindex="-1" role="dialog" aria-hidden="true"
		style="padding-right: 15px;" data-backdrop="static" data-keyboard="false">
		<div class="modal-dialog" style="width: 1200px; ">
			<div class="modal-content animated bounceInRight">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
							class="sr-only">Close</span></button>
					<h4 class="modal-title" id="modalTitleUpdateMatKhau">Modal title</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<form id="updateMatKhauForm" role="form">
							<div class="col-sm-6 b-r">
								<input type="hidden" id="id" name="userId">
								<div class="form-group">
									<label>Mã Khách Hàng</label>
									<input type="text" id="makh" name="maNv"
										placeholder="{-Mã Nhân Viên được tạo tự động có dạng : NV-XXX -}" class="form-control" readonly>
								</div>
								<div class="form-group">
									<label>Số Điện Thoại</label>
									<input type="text" id="sdt" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control"
										readonly>
								</div>
								<div class="form-group">
									<label>Email</label>
									<input type="text" id="email" name="email" placeholder="Nhập Số Điện Thoại" class="form-control"
										readonly>
								</div>
							</div>
							<div class="col-sm-6">
								<div class="form-group">
									<label>Tên Đăng Nhập</label>
									<input type="text" id="username" name="username" class="form-control" readonly>
								</div>
								<div class="form-group">
									<label>Tên Khách Hàng</label>
									<input type="text" id="fullName" name="phone" class="form-control" readonly>
								</div>
								<div class="form-group">
									<label>Mật Khẩu</label>
									<input type="password" id="password" name="phone" placeholder="Nhập Mật khẩu" class="form-control">
									<span class="text-danger" id="error-matKhau"></span>
								</div>
							</div>
							<br>
							<div style="margin-right: 14px">
								<button id="btnUpdatematKhau" class="btn btn-sm btn-success pull-right m-t-n-xs" type="button">
									<strong>Cập Nhật</strong>
								</button>
								<button id="resetmatkhau" class="btn btn-sm btn-primary pull-right m-t-n-xs" type="button"
									style="margin-right:6px;">
									<strong>Rsest</strong>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>






</th:block>

</html>
