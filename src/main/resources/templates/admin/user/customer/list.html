<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="admin/layout/base :: base"
>
<th:block th:fragment="content">
    <div class="row">
      <div class="ibox float-e-margins">
        <div class="ibox-title">
          <h5>Người Dùng</h5>
          <div class="ibox-tools">
            <a class="collapse-link">
              <i class="fa fa-chevron-up"></i>
            </a>
          </div>
        </div>
        <div class="ibox-content">
			<div class="row">
				<div class="col-sm-7 m-b-xs">
				</div>
				<div class="col-sm-2 m-b-xs">
					<select class="input-sm form-control input-s-sm inline">
						<option value="1">Hoạt Động</option>
						<option value="0">Ngừng Hoạt Động</option>
					</select>
				</div>
				<div class="col-sm-3">
					<div class="input-group">
						<input type="text" placeholder="Tìm Kiếm" class="input-sm form-control">
						<span class="input-group-btn">
							<button type="button" class="btn btn-sm btn-primary">
								<i class="fa fa-search"></i>
							</button>
						</span>
					</div>
				</div>
			</div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="ibox float-e-margins">
        <div class="ibox-title">
          <h5>Danh Sách Khách Hàng</h5>
          <div class="ibox-tools">
            <a class="collapse-link">
              <i class="fa fa-chevron-up"></i>
            </a>
            <a class="dropdown-toggle" data-toggle="dropdown" href="">
              <i class="fa fa-wrench"></i>
            </a>
            <a class="close-link">
              <i class="fa fa-times"></i>
            </a>
          </div>
        </div>
        <div class="ibox-content">
          <th:block th:replace="admin/user/customer/table :: table"></th:block>
        </div>
		<th:block th:fragment="script">
		
		<script>
		function toggleStatus(userId, isActive) {
			
			 const title = isActive
				? 'Bạn có chắc muốn vô hiệu hóa tài khoản này?'
				: 'Bạn có chắc muốn kích hoạt tài khoản này?';
			
			Swal.fire({
			title: title,
			icon: 'warning',
			showCancelButton: true,
			confirmButtonColor: '#3085d6',
			cancelButtonColor: '#d33',
			confirmButtonText: 'Xác nhận',
			cancelButtonText: 'Hủy'
			}).then((result) => {
			if (result.isConfirmed) {
				fetch(`/admin/customers/${userId}/toggle-status`, {
				method: 'PUT'
				})
				.then(res => {
				if (!res.ok) throw new Error('Cập nhật thất bại');
				return res.json();
				})
				.then(data => {
				Swal.fire({
					icon: 'success',
					title: data.message,
					timer: 1500,
					showConfirmButton: false
				});
				setTimeout(() => location.reload(), 1000);
				})
				.catch(err => {
				Swal.fire("Lỗi", err.message, "error");
				});
			}
			});
		}
		</script>
		</th:block>
      </div>
    </div>
</th:block>
</html>
