<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DTD-DashBoard | Login</title>

    <link th:href="@{/assets/css/bootstrap.min.css}" rel="stylesheet" />
    <link
      th:href="@{/assets/font-awesome/css/font-awesome.css}"
      rel="stylesheet"
    />
    <link th:href="@{/assets/css/animte.css}" rel="stylesheet" />
    <link th:href="@{/assets/css/style.css}" rel="stylesheet" />
  </head>

  <body class="gray-bg">
    <div class="middle-box text-center loginscreen animated fadeInDown">
      <div>
        <div>
          <h1 class="logo-name" style="font-size: 150px; margin-right: 10px">
            DTD
          </h1>
        </div>
        <h3>Welcome to DTD-DashBoard</h3>
        <form class="m-t" role="form" th:action="@{/do-login}" method="post">
          <div class="form-group">
            <input
              type="text"
              name="username"
              class="form-control"
              placeholder="Tên đăng nhập / email"
            />
          </div>
          <div class="form-group">
            <input
              type="password"
              name="password"
              class="form-control"
              placeholder="Mật khẩu"
            />
          </div>
          <button type="submit" class="btn btn-primary block full-width m-b">
            Đăng Nhập
          </button>

          <a href="#"><small>Forgot password?</small></a>
          <p class="text-muted text-center">
            <small>Chưa có tài khoản?</small>
          </p>
          <a class="btn btn-sm btn-white btn-block" href="register.html"
            >Tạo tài khoản mới</a
          >
        </form>
        <p class="m-t">
          <small>Sản phẩm của DTD-Squard on Bootstrap 3 © 2025</small>
        </p>
      </div>
    </div>

    <!-- Mainly scripts -->
    <script th:src="@{/assets/js/jquery-3.1.1.min.js}"></script>
    <script th:src="@{/assets/js/bootstrap.min.js}"></script>
  </body>
</html>
