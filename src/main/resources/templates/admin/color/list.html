<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="admin/layout/base :: base">
<th:block th:fragment="content">
    <div class="row col-lg-6" style="margin-left: 300px">
        <div class="ibox float-e-margins">
            <div class="ibox-title">
                <h5>Danh Sách Màu Sắc</h5>
                <div class="ibox-tools">
                    <a class="collapse-link">
                        <i class="fa fa-chevron-up"></i>
                    </a>
                </div>
            </div>
            <div class="ibox-content" id="colorTableContainer">
                <th:block th:replace="admin/color/table :: table"></th:block>
            </div>
        </div>
    </div>
    <div class="modal inmodal" id="myModal" tabindex="-1" role="dialog" aria-hidden="true" style="padding-right: 15px;">
        <div class="modal-dialog">
            <div class="modal-content animated bounceInRight">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
                            class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="modalTitle">Modal title</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <form role="form">
                            <div class="form-group">
                                <input type="hidden" id="id">
                                <label>Mã màu sắc</label>
                                <input type="text" id="code" placeholder="color Code" class="form-control" disabled>
                            </div>
                            <div class="form-group">
                                <label>Tên màu sắc</label>
                                <input type="text" id="name" class="form-control"></div>
                            <div>
                                <button class="btn btn-sm btn-primary pull-right m-t-n-xs" id="btnAddColor"
                                        type="button"><strong>Thêm</strong></button>
                                <button class="btn btn-sm btn-success pull-right m-t-n-xs" id="btnUpdate"
                                        type="button"><strong>Cập nhật</strong></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:fragment="script">
        <script th:src="@{/js/admin/color.js}"></script>
    </th:block>
</th:block>
</html>
