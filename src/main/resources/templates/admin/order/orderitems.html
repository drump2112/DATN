<th:block th:fragment="orderItems">
  <div class="p-3">
    <table class="table table-sm table-bordered m-0">
      <thead class="thead-light">
        <tr>
          <th>Ảnh</th>
          <th>Mã SP</th>
          <th>Tên sản phẩm</th>
          <th>Số lượng</th>
          <th>Đơn giá</th>
          <th>Thành tiền</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${items == null or #lists.isEmpty(items)}">
          <td colspan="5" class="text-center text-muted">Không có sản phẩm</td>
        </tr>
        <tr th:each="it : ${items}">
          <td>
            <img th:src="@{${it.productVariant.product.thumbnail}}" alt="Avatar" style="
              width: 50px;
              height: 50px;
              object-fit: cover;
              border-radius: 50%;
            " />
          </td>
          <td th:text="${it.productVariant != null ? it.productVariant.id : ''}">MãSP</td>
          <td th:text="${it.productVariant != null ? it.productVariant.product.name : '—'}">Tên SP</td>
          <td th:text="${it.quantity}">1</td>
          <td th:text="${#numbers.formatDecimal(it.unitPrice,0,0)} + ' ₫'">0 ₫</td>
          <td th:text="${#numbers.formatDecimal(it.totalPrice,0,0)} + ' ₫'">0 ₫</td>
        </tr>
      </tbody>
    </table>
  </div>
</th:block>
