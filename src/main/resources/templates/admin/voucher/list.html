<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="admin/layout/base :: base">
<th:block th:fragment="content">
	<div class="row">
		<div class="col-lg-12">
			<div class="ibox float-e-margins">
				<div class="tabs-container">
					<ul class="nav nav-tabs">
						<li class="active"><a data-toggle="tab" href="#tab-1" aria-expanded="false"> Voucher</a></li>
						<li class=""><a data-toggle="tab" href="#tab-2" aria-expanded="false">Đợt Giảm Giá</a></li>
					</ul>
					<div class="tab-content">
						<div id="tab-1" class="tab-pane active">
							<div class="panel-body">
								<div class="ibox-title">
									<h5>Danh Sách Voucher</h5>
								</div>
								<div class="ibox-content">
									<div class="row">
										<div class="col-sm-2 m-b-xs">
											<select class="input-sm form-control input-s-sm inline" id="statusFilter">
												<option value="">Chọn trạng thái</option>
												<option value="1">Đang Hoạt Động</option>
												<option value="0">Ngừng Hoạt Động</option>
											</select>
										</div>
										<div class="col-sm-3 m-b-xs">
											<div class="input-group">
												<input type="text" placeholder="Tìm Kiếm" class="input-sm form-control" id="searchInput">
												<span class="input-group-btn">
													<button type="button" class="btn btn-sm btn-primary" onclick="searchVoucher(0)">
														<i class="fa fa-search"></i>
													</button>
												</span>
											</div>
										</div>
										<div class="col-sm-7">
											<span class="input-group-btn">
												<button type="button" class="btn btn-sm btn-primary pull-right" id="btnAddVoucher">
													<i class="fa fa-plus-circle"></i> Thêm
												</button>
											</span>
										</div>
									</div>
									<div class="table-responsive" id="voucherTableContainer">
										<th:block th:replace="admin/voucher/tableVoucher :: table"></th:block>
									</div>
								</div>
							</div>
						</div>
						<div id="tab-2" class="tab-pane">
							<div class="panel-body">
								<div class="ibox-title">
									<h5>Danh Sách Đợt Giảm Giá</h5>
								</div>
								<div class="ibox-content">
									<div class="row">
										<div class="col-sm-2 m-b-xs">
											<select class="input-sm form-control input-s-sm inline" id="statusFilter">
												<option value="">Chọn trạng thái</option>
												<option value="1">Đang Hoạt Động</option>
												<option value="0">Ngừng Hoạt Động</option>
											</select>
										</div>
										<div class="col-sm-3 m-b-xs">
											<div class="input-group">
												<input type="text" placeholder="Tìm Kiếm" class="input-sm form-control" id="searchInput">
												<span class="input-group-btn">
													<button type="button" class="btn btn-sm btn-primary" onclick="searchVoucher(0)">
														<i class="fa fa-search"></i>
													</button>
												</span>
											</div>
										</div>
										<div class="col-sm-7">
											<span class="input-group-btn">
												<button type="button" class="btn btn-sm btn-primary pull-right" id="btnAddEvent">
													<i class="fa fa-plus-circle"></i> Thêm
												</button>
											</span>
										</div>
									</div>
									<div class="table-responsive" id="voucherTableContainer">
										<th:block th:replace="admin/voucher/tableEvent :: table"></th:block>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="modal inmodal" id="modalVoucher" tabindex="-1" role="dialog" aria-hidden="true"
		style="padding-right: 15px;" data-backdrop="static" data-keyboard="false">
		<div class="modal-dialog" style="width: 1200px;	">
			<div class="modal-content animated bounceInRight">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
							class="sr-only">Close</span></button>
					<h4 class="modal-title" id="modalTitle">Modal title</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<form id="employeeForm" role="form">
							<div class="col-sm-6 b-r">
								<input type="hidden" id="voucherId" name="voucherId">
								<div class="form-group">
									<label>Mã Giảm Giá</label>
									<input type="text" id="maNv" name="maNv"
										placeholder="Mã Giảm Giá" class="form-control" >
								</div>
								<div class="form-group">
									<label>Tên Mã Giảm Giá</label>
									<input type="text" id="hoTen" name="fullName" placeholder="Nhập Tên Giảm Giá" class="form-control">
								</div>
								<div class="form-group">
									<label>Loại Gỉảm Giá</label>
									<input type="text" id="email" name="email" placeholder="Nhập Email" class="form-control">
								</div>
								<div class="form-group">
									<label>Giá Trị Giảm</label>
									<input type="text" id="sdt" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control">
								</div>
								<div class="form-group">
									<label>Giá Trị Đơn Hàng Tối Thiểu</label>
									<input type="text" id="sdt" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control">
								</div>
							</div>
							<div class="col-sm-6">
								<div class="form-group">
									<label>Giá Trị Giảm Tối Đa</label>
									<input type="text" id="sdt" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control">
								</div>
								<div class="form-group" id="ngaySinhGroup">
									<label>Ngày Bắt Đầu</label>
									<input type="date" id="dob" name="dateOfBirth" lang="vi" class="form-control">
									<span class="text-danger" id="error-dob"></span>
								</div>
								<div class="form-group" id="ngaySinhGroup">
									<label>Ngày Kết Thúc</label>
									<input type="date" id="dob" name="dateOfBirth" lang="vi" class="form-control">
									<span class="text-danger" id="error-dob"></span>
								</div>
								<div class="form-group" id="usernameGroup">
									<label>Trạng Thái</label>
									<select class="form-control m-b" id="vaiTro" name="roleId">
										<option value="1">Hoạt Động</option>
										<option value="0">Không Hoạt Động</option>
									</select>
								</div>
								<div class="form-group">
									<label>Số Lượng</label>
									<input type="text" id="sdt" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control">
								</div>
							</div>
							<div style="margin-right: 14px">
								<button id="btnUpdateVoucher" class="btn btn-sm btn-success pull-right m-t-n-xs" type="button">
									<strong>Cập Nhật</strong>
								</button>
								<button id="btnAddVoucher" class="btn btn-sm btn-primary pull-right m-t-n-xs" type="button"
									style="margin-right:6px;">
									<strong>Thêm</strong>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

<div class="modal inmodal" id="modalEvent" tabindex="-1" role="dialog" aria-hidden="true"
		style="padding-right: 15px;" data-backdrop="static" data-keyboard="false">
		<div class="modal-dialog" style="width: 1200px;	">
			<div class="modal-content animated bounceInRight">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
							class="sr-only">Close</span></button>
					<h4 class="modal-title" id="modalTitle">Modal title</h4>
				</div>
				<div class="modal-body">
					<div class="row">
						<form id="employeeForm" role="form">
							<div class="col-sm-6 b-r">
								<input type="hidden" id="eventId" name="userId">
								<div class="form-group">
									<label>Mã Sự Kiện</label>
									<input type="text" id="maNv" name="maNv"
										placeholder="Mã Sự Kiện" class="form-control" >
								</div>
								<div class="form-group">
									<label>Tên Sự Kiện</label>
									<input type="text" id="hoTen" name="fullName" placeholder="Nhập Họ Tên" class="form-control">
								</div>
								<div class="form-group">
									<label>Kiểu Giảm Giá</label>
									<input type="text" id="email" name="email" placeholder="Nhập Email" class="form-control">
								</div>
								<div class="form-group">
									<label>Giá Trị Giảm</label>
									<input type="text" id="sdt" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control">
								</div>

							</div>
							<div class="col-sm-6">
								<div class="form-group">
									<label>Giá Trị Giảm Tối Đa</label>
									<input type="text" id="sdt" name="phone" placeholder="Nhập Số Điện Thoại" class="form-control">
								</div>
								<div class="form-group" >
									<label>Ngày Bắt Đầu</label>
									<input type="date" id="d" name="dateOfBirth" lang="vi" class="form-control">
								</div>
								<div class="form-group" id="ngaySinhGroup">
									<label>Ngày Kết Thúc</label>
									<input type="date" id="dob" name="dateOfBirth" lang="vi" class="form-control">
								</div>
								<div class="form-group">
									<label>Trạng Thái</label>
									<select class="form-control m-b" id="vaiTro" name="roleId">
										<option value="1">Hoạt Động</option>
										<option value="2">Không Hoạt Động</option>
									</select>
								</div>
							</div>
							<div style="margin-right: 14px">
								<button id="btnUpdate" class="btn btn-sm btn-success pull-right m-t-n-xs" type="button">
									<strong>Cập Nhật</strong>
								</button>
								<button id="btnAdd" class="btn btn-sm btn-primary pull-right m-t-n-xs" type="button"
									style="margin-right:6px;">
									<strong>Thêm</strong>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<th:block th:fragment="script">
		<script th:src="@{/js/admin/voucher.js}"></script>
		<script th:src="@{/js/admin/event.js}"></script>
	</th:block>
</th:block>

</html>
