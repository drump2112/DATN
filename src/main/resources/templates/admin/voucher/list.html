<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="admin/layout/base :: base">
<th:block th:fragment="content">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="tabs-container">
                    <ul class="nav nav-tabs">
                        <li class="active"><a data-toggle="tab" href="#tab-1" aria-expanded="false"> Voucher</a></li>
                        <li class=""><a data-toggle="tab" href="#tab-2" aria-expanded="false">Đợt Giảm Giá</a></li>
                    </ul>
                    <div class="tab-content">
                        <div id="tab-1" class="tab-pane active">
                            <div class="panel-body">
                                <div class="ibox-title">
                                    <h5>Danh Sách Voucher</h5>
                                </div>
                                <div class="ibox-content">
                                    <div class="row">
                                        <div class="col-sm-2 m-b-xs">
                                            <select class="input-sm form-control input-s-sm inline"
                                                id="voucherStatusFilter">
                                                <option value="">Chọn trạng thái</option>
                                                <option value="1">Đang Hoạt Động</option>
                                                <option value="0">Ngừng Hoạt Động</option>
                                            </select>
                                        </div>
                                        <div class="col-sm-3 m-b-xs">
                                            <div class="input-group">
                                                <input type="text" placeholder="Tìm Kiếm Voucher"
                                                    class="input-sm form-control" id="voucherSearchInput">
                                                <span class="input-group-btn">
                                                    <button type="button" class="btn btn-sm btn-primary"
                                                        onclick="searchVoucher(0)">
                                                        <i class="fa fa-search"></i>
                                                    </button>
                                                </span>
                                            </div>
                                        </div>
                                        <div class="col-sm-7">
                                            <span class="input-group-btn">
                                                <button type="button" class="btn btn-sm btn-primary pull-right"
                                                    id="btnOpenAddVoucher">
                                                    <i class="fa fa-plus-circle"></i> Thêm
                                                </button>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="table-responsive" id="voucherTableContainer">
                                        <th:block th:replace="admin/voucher/tableVoucher :: table"></th:block>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="tab-2" class="tab-pane">
                            <div class="panel-body">
                                <div class="ibox-title">
                                    <h5>Danh Sách Đợt Giảm Giá</h5>
                                </div>
                                <div class="ibox-content">
                                    <div class="row">
                                        <div class="col-sm-2 m-b-xs">
                                            <select class="input-sm form-control input-s-sm inline"
                                                id="eventStatusFilter">
                                                <option value="">Chọn trạng thái</option>
                                                <option value="1">Đang Hoạt Động</option>
                                                <option value="0">Ngừng Hoạt Động</option>
                                            </select>
                                        </div>
                                        <div class="col-sm-3 m-b-xs">
                                            <div class="input-group">
                                                <input type="text" placeholder="Tìm Kiếm Event"
                                                    class="input-sm form-control" id="eventSearchInput">
                                                <span class="input-group-btn">
                                                    <button type="button" class="btn btn-sm btn-primary"
                                                        onclick="searchEvent(0)">
                                                        <i class="fa fa-search"></i>
                                                    </button>
                                                </span>
                                            </div>
                                        </div>
                                        <div class="col-sm-7">
                                            <span class="input-group-btn">
                                                <button type="button" class="btn btn-sm btn-primary pull-right"
                                                    id="btnOpenAddEvent">
                                                    <i class="fa fa-plus-circle"></i> Thêm
                                                </button>
                                            </span>
                                        </div>
                                    </div>
                                    <div class="table-responsive" id="eventTableContainer">
                                        <th:block th:replace="admin/voucher/tableEvent :: table"></th:block>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal Voucher -->
    <div class="modal inmodal" id="modalVoucher" tabindex="-1" role="dialog" aria-hidden="true"
        style="padding-right: 15px;" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog" style="width: 1200px;">
            <div class="modal-content animated bounceInRight">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
                            class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="voucherModalTitle">Thêm Voucher</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <form id="voucherForm" role="form">
                            <input type="hidden" id="voucherId" name="id">
                            <div class="col-sm-6 b-r">
                                <div class="form-group">
                                    <label>Mã Voucher</label>
                                    <input type="text" id="voucherCode" name="code"
                                        placeholder="Mã Voucher (tự sinh nếu để trống)" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Tên Voucher</label>
                                    <input type="text" id="voucherName" name="name" placeholder="Nhập Tên Voucher"
                                        class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Loại Giảm Giá</label>
                                    <select id="voucherDiscountType" name="discountType" class="form-control"  placeholder="">
                                        <option value="" disabled selected>Chọn loại giảm giá</option>
                                        <option value="PERCENT">Phần trăm (%)</option>
                                        <option value="FIXED">Số tiền cố định</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Giá Trị Giảm</label>
                                    <input type="number" id="voucherDiscountValue" name="discountValue"
                                        placeholder="Giá trị giảm" class="form-control" min="0">
                                </div>
                                <div class="form-group">
                                    <label>Đơn Hàng Tối Thiểu</label>
                                    <input type="number" id="voucherMinOrderAmount" name="minOrderAmount"
                                        placeholder="Số tiền tối thiểu" class="form-control" min="0">
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label>Giá Trị Giảm Tối Đa</label>
                                    <input type="number" id="voucherMaxDiscountValue" name="maxDiscountValue"
                                        placeholder="Giảm tối đa" class="form-control" min="0">
                                </div>
                                <div class="form-group">
                                    <label>Ngày Bắt Đầu</label>
                                    <input type="date" id="voucherStartDate" name="startDate" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Ngày Kết Thúc</label>
                                    <input type="date" id="voucherEndDate" name="endDate" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Trạng Thái</label>
                                    <select class="form-control" id="voucherIsActive" name="isActive">
                                        <option value="" disabled selected>Chọn trạng thái</option>
                                        <option value="1">Hoạt Động</option>
                                        <option value="0">Không Hoạt Động</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Số Lượng</label>
                                    <input type="number" id="voucherQuantity" name="quantity"
                                        placeholder="Số lượng voucher" class="form-control">
                                </div>
                            </div>
                            <div style="margin-right: 14px; clear: both;">
                                <button id="btnUpdateVoucher" class="btn btn-sm btn-success pull-right m-t-n-xs"
                                    type="button" style="display: none;">
                                    <strong>Cập Nhật</strong>
                                </button>
                                <button id="btnSaveVoucher" class="btn btn-sm btn-primary pull-right m-t-n-xs"
                                    type="button" style="margin-right:6px;">
                                    <strong>Thêm/Lưu</strong>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal Event (cập nhật: sections dynamic với multi-select list cho từng lựa chọn, như "Theo Danh Mục" hiển thị list danh mục để chọn nhiều) -->
    <div class="modal inmodal" id="modalEvent" tabindex="-1" role="dialog" aria-hidden="true"
        style="padding-right: 15px;" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog" style="width: 1200px;">
            <div class="modal-content animated bounceInRight">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">×</span><span
                            class="sr-only">Close</span></button>
                    <h4 class="modal-title" id="eventModalTitle">Thêm Đợt Giảm Giá</h4>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <form id="eventForm" role="form">
                            <input type="hidden" id="eventId" name="id">
                            <div class="col-sm-6 b-r">
                                <div class="form-group">
                                    <label>Mã Sự Kiện</label>
                                    <input type="text" id="eventCode" name="code" placeholder="Mã Sự Kiện"
                                        class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Tên Sự Kiện</label>
                                    <input type="text" id="eventName" name="name" placeholder="Nhập Tên Sự Kiện"
                                        class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Kiểu Giảm Giá</label>
                                    <select id="eventDiscountType" name="discountType" class="form-control">
                                        <option value="PERCENT">Phần trăm (%)</option>
                                        <option value="FIXED">Số tiền cố định</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Giá Trị Giảm</label>
                                    <input type="number" id="eventDiscountValue" name="discountValue"
                                        placeholder="Giá trị giảm" class="form-control">
                                </div>


                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <label>Giá Trị Giảm Tối Đa</label>
                                    <input type="number" id="eventMaxDiscountValue" name="maxDiscountValue"
                                        placeholder="Giảm tối đa" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Ngày Bắt Đầu</label>
                                    <input type="date" id="eventStartDate" name="startDate" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Ngày Kết Thúc</label>
                                    <input type="date" id="eventEndDate" name="endDate" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label>Trạng Thái</label>
                                    <select class="form-control" id="eventIsActive" name="isActive">
                                        <option value="1">Hoạt Động</option>
                                        <option value="0">Không Hoạt Động</option>
                                    </select>
                                </div>
                            </div>
                            <div style="margin-right: 14px; clear: both;">
                                <button id="btnUpdateEvent" class="btn btn-sm btn-success pull-right m-t-n-xs"
                                    type="button" style="display: none;">
                                    <strong>Cập Nhật</strong>
                                </button>
                                <button id="btnSaveEvent" class="btn btn-sm btn-primary pull-right m-t-n-xs"
                                    type="button" style="margin-right:6px;">
                                    <strong>Thêm/Lưu</strong>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:fragment="script">
        <script th:src="@{/js/admin/voucher.js}"></script>
        <script th:src="@{/js/admin/event.js}"></script>
    </th:block>
</th:block>

</html>
