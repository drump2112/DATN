<th:block th:fragment="table">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Mã Giảm Giá</th>
            <th>Tên Voucher</th>
            <th>Kiểu Giảm</th>
            <th>Giá Trị Giảm</th>
            <th>Giá Trị Đơn Hàng Tối Thiểu</th>
            <th>Giá Trị Giảm Tối Đa</th>
            <th>Số Lượng</th>
            <th>Ngày Bắt Đầu</th>
            <th>Ngày Kết Thúc</th>
            <th>Trạng Thái</th>
            <th>Hành Động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${vouchers}">
            <td th:text="${item.id}"></td>
            <td th:text="${item.code}"></td>
            <td th:text="${item.name}"></td>
            <td th:switch="${item.discountType}">
                <span th:case="'FIXED'" class="badge badge-success">Cố Định</span>
                <span th:case="'PERCENT'" class="badge badge-info">Theo %</span>
            </td>
            <!--                <td-->
            <!--                    th:text="${#numbers.formatDecimal(item.discountValue, 0, 0)} + ' ' + (${#strings.toUpperCase(item.discountType)} == 'FIXED' ? 'VNĐ' : '%')">-->
            <!--                </td>-->
            <td class="money-cell">
                <span class="money-amount"
                      th:text="${#numbers.formatDecimal(item.discountValue, 0, 'POINT', 0, 'COMMA')} + ' ' + (${#strings.toUpperCase(item.discountType)} == 'FIXED' ? 'VNĐ' : '%')"></span>
            </td>
            <td class="money-cell">
                <span class="money-amount"
                      th:text="${#numbers.formatDecimal(item.minOrderAmount, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'"></span>
            </td>
            <td class="money-cell">
                <span class="money-amount"
                      th:if="${item.maxDiscountValue != null}"
                      th:text="${#numbers.formatDecimal(item.maxDiscountValue, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'"></span>
            </td>
            <td th:text="${#numbers.formatDecimal(item.quantity, 0, 0)}"></td>
            <td th:text="${#temporals.format(item.startDate, 'dd/MM/yyyy')}"></td>
            <td th:text="${#temporals.format(item.endDate, 'dd/MM/yyyy')}"></td>
            <td th:switch="${item.isActive}">
                <span th:case="true" class="badge badge-primary">Hoạt Động</span>
                <span th:case="false" class="badge badge-danger">Ngừng</span>
            </td>
            <td>
                <button class="btn btn-info dim" type="button" th:attr="data-id=${item.id},
                               data-code=${item.code},
                               data-name=${item.name},
                               data-discounttype=${item.discountType},
                               data-discountvalue=${item.discountValue},
                               data-minorderamount=${item.minOrderAmount},
                               data-maxdiscountvalue=${item.maxDiscountValue},
                               data-startdate=${item.startDate},
                               data-enddate=${item.endDate},
                               data-isactive=${item.isActive},
                               data-quantity=${item.quantity}" th:title="'Thông tin và cập nhật'"
                        onclick="handleVoucherDetailClick(this)">
                    <i class="fa fa-eye"></i>
                </button>
                <button th:id="'btn-status-' + ${item.id}"
                        th:class="'btn ' + (${item.isActive} ? 'btn-danger dim' : 'btn-primary dim')"
                        th:onclick="|toggleVoucherStatus( ${item.id}, ${item.isActive} )|"
                        th:title="${item.isActive} ? 'Khóa mã giảm giá' : 'Kích hoạt mã giảm giá'">
                    <i th:class="${item.isActive} ? 'fa fa-lock' : 'fa fa-unlock'"></i>
                </button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="text-center" th:if="${voucherTotalPages > 1}">
        <ul class="pagination">
            <li th:class="${voucherCurrentPage == 0} ? 'disabled' : ''">
                <a th:if="${voucherCurrentPage > 0}" href="#"
                   th:onclick="'searchVoucher(' + (${voucherCurrentPage - 1}) + ')'">
                    <i class="fa fa-angle-left"></i> Trước
                </a>
                <span th:if="${voucherCurrentPage == 0}" class="disabled">
                    <i class="fa fa-angle-left"></i> Trước
                </span>
            </li>

            <li th:each="i : ${#numbers.sequence(0, voucherTotalPages - 1)}"
                th:class="${i == voucherCurrentPage} ? 'active' : ''">
                <a href="#" th:onclick="'searchVoucher(' + (${i}) + ')'" th:text="${i + 1}">1</a>
            </li>

            <li th:class="${voucherCurrentPage == voucherTotalPages - 1} ? 'disabled' : ''">
                <a th:if="${voucherCurrentPage < voucherTotalPages - 1}" href="#"
                   th:onclick="'searchVoucher(' + (${voucherCurrentPage + 1}) + ')'">
                    Sau <i class="fa fa-angle-right"></i>
                </a>
                <span th:if="${voucherCurrentPage == voucherTotalPages - 1}" class="disabled">
                    Sau <i class="fa fa-angle-right"></i>
                </span>
            </li>
        </ul>
        <p class="text-muted">
            Hiển thị trang <strong th:text="${voucherCurrentPage + 1}">1</strong>
            / <strong th:text="${voucherTotalPages}">1</strong>
            (Tổng <strong th:text="${voucherTotalItems}">0</strong> voucher)
        </p>
    </div>
</th:block>
